name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Build and test (Windows, LLVM-MinGW)
    runs-on: windows-latest

    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      # Cache vcpkg's binary artifacts between runs; the first configure
      # otherwise builds every dependency from source.
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/vcpkg-cache,readwrite

    steps:
      # A plain checkout, so this job fails if anything the build needs is
      # untracked -- which is exactly how the toolchain directory used to
      # break a fresh clone.
      - uses: actions/checkout@v4

      - name: Install Ninja
        run: choco install ninja --no-progress

      - name: Install LLVM-MinGW
        shell: pwsh
        run: |
          # Pin the toolchain so a new upstream release cannot change the
          # compiler under CI without a commit here.
          $release = "20260616"
          $url = "https://github.com/mstorsjo/llvm-mingw/releases/download/$release/llvm-mingw-$release-ucrt-x86_64.zip"
          # Release downloads fail transiently often enough to be worth
          # retrying: a single 5xx from the CDN should not fail a pull request.
          for ($try = 1; $try -le 4; $try++) {
            try {
              Invoke-WebRequest -Uri $url -OutFile llvm-mingw.zip
              break
            } catch {
              if ($try -eq 4) { throw }
              $wait = [math]::Pow(2, $try)
              Write-Host "Download failed (attempt $try): $($_.Exception.Message). Retrying in ${wait}s."
              Start-Sleep -Seconds $wait
            }
          }
          Expand-Archive llvm-mingw.zip -DestinationPath "$env:GITHUB_WORKSPACE\toolchains"
          $root = (Get-ChildItem "$env:GITHUB_WORKSPACE\toolchains" -Directory)[0].FullName
          # Check here, with a clear message, rather than letting it surface
          # deep inside vcpkg's compiler detection, which reports only a log
          # path on a runner that is about to disappear.
          $cxx = Join-Path $root "bin\x86_64-w64-mingw32-clang++.exe"
          if (-not (Test-Path $cxx)) {
            Get-ChildItem "$env:GITHUB_WORKSPACE\toolchains" -Recurse -Depth 1 |
              Select-Object -First 20 -ExpandProperty FullName
            throw "Extracted toolchain has no compiler at $cxx"
          }
          & $cxx --version
          "LLVM_MINGW_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Bootstrap vcpkg
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg.git "$env:VCPKG_ROOT"
          # bootstrap downloads vcpkg.exe from a GitHub release, which has
          # returned HTTP 500 here before and failed an unrelated docs-only
          # pull request.
          for ($try = 1; $try -le 4; $try++) {
            & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat" -disableMetrics
            if ($LASTEXITCODE -eq 0) { break }
            if ($try -eq 4) { throw "vcpkg bootstrap failed after $try attempts" }
            $wait = [math]::Pow(2, $try)
            Write-Host "Bootstrap failed (attempt $try). Retrying in ${wait}s."
            Start-Sleep -Seconds $wait
          }

      - name: Cache vcpkg binaries
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/vcpkg-cache
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'toolchain/**') }}
          restore-keys: vcpkg-${{ runner.os }}-

      - name: Configure
        run: cmake --preset default -B build

      # vcpkg reports only the paths of the logs that explain a failure, and
      # the runner is gone by the time anyone reads the summary.
      - name: Dump vcpkg logs on failure
        if: failure()
        shell: pwsh
        run: |
          Get-ChildItem -Path build/vcpkg-manifest-install.log,
            "$env:VCPKG_ROOT/buildtrees/*/*.log" -ErrorAction SilentlyContinue |
            ForEach-Object {
              Write-Output "==================== $($_.FullName)"
              Get-Content $_.FullName -Tail 60
            }

      - name: Build
        run: ninja -C build

      - name: Test
        # SDL has no display, audio device or GPU on a runner; the dummy
        # drivers are what let the smoke tests start the real game loop.
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
          SDL_RENDER_DRIVER: software
        run: ctest --test-dir build --output-on-failure

  format:
    name: clang-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check formatting
        run: |
          find engine game tests -name '*.cpp' -o -name '*.hpp' \
            | xargs clang-format --dry-run --Werror
